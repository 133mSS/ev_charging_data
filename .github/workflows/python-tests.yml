name: Python tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas python-dotenv

      - name: Compile Snowflake deployment and Streamlit sources
        run: python -m py_compile scripts/deploy_snowflake.py snowflake/streamlit_app.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
