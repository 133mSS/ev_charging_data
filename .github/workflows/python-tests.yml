name: Python tests

on:
  push:
    branches:
      - main
      - feature/jpl-temporal-power-audit
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas python-dotenv

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
